
# ===================================================================
# APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=placement-management-system
server.port=${PORT:${SERVER_PORT:8080}}


# ===================================================================
# DEFAULT PROFILE - LOCAL DEVELOPMENT (MySQL)
# ===================================================================

# Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/placement_management_system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# JPA / Hibernate Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# JWT Configuration
# JWT_SECRET must be a Base64-encoded HMAC key with at least 256 bits.
application.security.jwt.secret=${JWT_SECRET:}
application.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging Configuration
logging.level.root=INFO
logging.level.com.placementmanagementsystem=INFO
logging.level.org.springframework.security=WARN

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Rate Limiting Configuration
application.rate-limiting.enabled=${RATE_LIMITING_ENABLED:true}
application.rate-limiting.login.limit=${RATE_LIMITING_LOGIN_LIMIT:5}
application.rate-limiting.login.duration-in-seconds=${RATE_LIMITING_LOGIN_DURATION_SECONDS:60}
application.rate-limiting.register.limit=${RATE_LIMITING_REGISTER_LIMIT:5}
application.rate-limiting.register.duration-in-seconds=${RATE_LIMITING_REGISTER_DURATION_SECONDS:60}
application.rate-limiting.trusted-proxy=${RATE_LIMITING_TRUSTED_PROXY:false}
application.rate-limiting.max-buckets=${RATE_LIMITING_MAX_BUCKETS:10000}

# CORS Configuration
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# OpenAPI / Swagger Documentation
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
