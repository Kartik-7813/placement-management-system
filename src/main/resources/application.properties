spring.application.name=placement-management-system

# Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/placement_management_system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# JWT Configuration
# Note: JWT_SECRET must be a Base64-encoded HMAC key with at least 256 bits (32 bytes).
application.security.jwt.secret=${JWT_SECRET:}
application.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
