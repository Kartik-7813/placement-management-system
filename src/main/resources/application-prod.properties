
# ===================================================================
# PRODUCTION PROFILE
# Activated using spring.profiles.active=prod
# ===================================================================

# Production Database Safety
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Production Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Mandatory JWT Secret
application.security.jwt.secret=${JWT_SECRET}

# Production CORS
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Disable API Documentation in Production
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
