
# ===================================================================
# TIDB CLOUD PROFILE
# Activated using spring.profiles.active=tidb
# ===================================================================

# TiDB Cloud Datasource
spring.datasource.url=${TIDB_JDBC_URL}
spring.datasource.username=${TIDB_USERNAME}
spring.datasource.password=${TIDB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Safety
# Hibernate must never automatically modify the database schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
application.security.jwt.secret=${JWT_SECRET}

# CORS Configuration
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Disable API Documentation
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
